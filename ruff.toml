target-version = "py314"
line-length = 88

# Migrations are generated by Django, so don't lint or reformat them.
extend-exclude = ["env", "*/migrations/*"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: unused imports/variables, undefined names
    "I",   # isort: import ordering
    "B",   # bugbear: likely bugs and risky patterns
    "UP",  # pyupgrade: outdated syntax for the target Python version
    "N",   # pep8-naming
    "SIM", # simplifiable code
    "DJ",  # Django-specific checks (models, forms)
    "S",   # bandit: security checks
]

# Line length is handled by the formatter; don't also report it as a lint error.
ignore = ["E501"]

# Still report unused imports (F401), but never auto-remove them on save / --fix.
unfixable = ["F401"]

[lint.per-file-ignores]
# Tests use plain `assert`, hardcoded dummy passwords and seeded (non-crypto) random.
"**/tests.py" = ["S101", "S105", "S106", "S311"]
"**/tests/*.py" = ["S101", "S105", "S106", "S311"]

[lint.isort]
known-first-party = ["accounts", "language", "language_app"]
